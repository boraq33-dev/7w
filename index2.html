<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>طلب خدمة | SAWA INTERNET</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:#eaf6ff;color:#10243e}.page{min-height:100vh;padding:25px 15px 45px;background:linear-gradient(rgba(235,248,255,.74),rgba(235,248,255,.9)),url("ddaa.gif") center/cover fixed no-repeat}.card{width:min(560px,100%);margin:auto;background:rgba(255,255,255,.95);border:1px solid #d8ebfa;border-radius:26px;padding:26px 20px;box-shadow:0 18px 50px rgba(0,70,140,.2)}.brand{text-align:center}.brand h1{margin:0;font-size:33px;color:#06182c}.brand span{color:#087cf0}.brand p{color:#60758a;margin:6px 0 20px}h2{text-align:center;color:#087cf0;margin:10px 0 23px}.field{margin-bottom:16px}label{display:block;font-weight:bold;margin-bottom:8px}input,select,textarea{width:100%;padding:14px;border:2px solid #d6e7f6;border-radius:14px;font:16px Tahoma;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#1590ff;box-shadow:0 0 0 4px rgba(21,144,255,.1)}textarea{min-height:100px;resize:vertical}button{width:100%;border:0;border-radius:15px;padding:16px;font-size:18px;font-weight:bold;color:white;background:linear-gradient(135deg,#006fe6,#00a8ff);cursor:pointer}button:disabled{opacity:.6}#result{display:none;margin-top:15px;padding:13px;border-radius:12px;text-align:center;font-weight:bold}.success{display:block!important;background:#e8fff2;color:#08743c}.error{display:block!important;background:#fff0f0;color:#a32020}.back{display:block;text-align:center;margin-top:18px;color:#087cf0;text-decoration:none;font-weight:bold}.note{text-align:center;color:#70859a;font-size:13px;margin-top:13px}</style></head><body><div class="page"><main class="card"><div class="brand"><h1>SAWA <span>INTERNET</span></h1><p>طلب خدمة — شبكة سوا</p></div><h2>تسجيل طلب خدمة</h2><form id="serviceForm"><div class="field"><label>الاسم الكامل</label><input name="name" type="text" placeholder="اكتب اسمك الكامل" required></div><div class="field"><label>مكان السكن</label><input name="residence" type="text" placeholder="المنطقة / الحي" required></div><div class="field"><label>رقم الهاتف</label><input name="phone" type="tel" inputmode="tel" placeholder="اكتب رقم هاتفك" required></div><div class="field"><label>نوع الخدمة</label><select name="service" required><option value="">اختر الخدمة</option><option>تركيب كافة أنواع قطع الإنترنت</option><option>بيع بطاقة إنترنت</option><option>اشتراك إنترنت</option><option>صيانة / دعم فني</option><option>خدمة أخرى</option></select></div><div class="field"><label>ملاحظات (اختياري)</label><textarea name="notes" placeholder="اكتب أي تفاصيل إضافية..."></textarea></div><button id="submitBtn" type="submit">تأكيد طلب الخدمة</button><div id="result"></div></form><div class="note">عند التأكيد يتم إرسال الطلب مباشرة إلى إدارة شبكة SAWA.</div><a class="back" href="index.html">العودة إلى الصفحة الرئيسية</a></main></div><script>const f=document.getElementById('serviceForm'),b=document.getElementById('submitBtn'),r=document.getElementById('result');f.addEventListener('submit',async e=>{e.preventDefault();r.className='';r.textContent='';b.disabled=true;b.textContent='جاري إرسال الطلب...';try{const x=await fetch('send_request.php',{method:'POST',body:new FormData(f),headers:{Accept:'application/json'}}),d=await x.json();if(!x.ok||!d.success)throw Error();r.className='success';r.textContent='تم إرسال طلبك بنجاح ✅ سنتواصل معك قريباً.';f.reset()}catch(e){r.className='error';r.textContent='تعذر إرسال الطلب. تأكد من إعدادات الاستضافة.'}finally{b.disabled=false;b.textContent='تأكيد طلب الخدمة'}});</script></body></html>
